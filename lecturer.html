<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMATT Lecturer</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:Arial;background:#f5f7fb;padding:15px}.card{background:#fff;padding:20px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,.1)}input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd}button{background:#1a73e8;color:#fff;font-weight:bold;border:none}.hidden{display:none}#qrcode{display:flex;justify-content:center;margin:15px 0}.attendee{padding:8px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}</style>
</head><body>
<div class="card" id="loginCard"><h2>IMATT Lecturer Login</h2><input type="email" id="email" placeholder="Lecturer Email"><input type="password" id="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg" style="color:red"></p></div>
<div class="card hidden" id="mainCard"><h3>Welcome <span id="userEmail"></span> <button onclick="logout()" style="width:auto;background:#e53935">Logout</button></h3><select id="dept"><option>Computer Science</option><option>Business Admin</option><option>Engineering</option></select><input id="module" placeholder="Module e.g. OS"><select id="year"><option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option></select><input id="group" placeholder="Group A"><button onclick="generateQR()">GENERATE QR</button><div id="qrSection" class="hidden"><div id="qrcode"></div><p id="qrLink" style="word-break:break-all;font-size:12px"></p><button onclick="copyLink()">Copy Link</button></div><hr><h3>Attendance - <span id="count">0</span></h3><div id="list"></div><button onclick="exportCSV()" style="background:#34a853">Export CSV</button></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBbfZkPmrPyEAkpaaAG5DPb4tk7k30ILPU",authDomain:"imatt---attendance.firebaseapp.com",databaseURL:"https://imatt---attendance-default-rtdb.firebaseio.com",projectId:"imatt---attendance",storageBucket:"imatt---attendance.firebasestorage.app",messagingSenderId:"774914670268",appId:"1:774914670268:web:c0890f062e849f883e5ab9"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.database();let currentSessionId=null;
auth.onAuthStateChanged(u=>{if(u){loginCard.classList.add('hidden');mainCard.classList.remove('hidden');userEmail.innerText=u.email}else{loginCard.classList.remove('hidden');mainCard.classList.add('hidden')}});
function login(){auth.signInWithEmailAndPassword(email.value,password.value).catch(e=>loginMsg.innerText=e.message)}
function logout(){auth.signOut()}
function generateQR(){if(!module.value){alert('Enter module');return}currentSessionId=dept.value.substring(0,4)+'-'+Date.now();const base=location.href.replace('lecturer.html','').replace(/\/$/,'');const link=base+'/student.html?session='+currentSessionId;db.ref('sessions/'+currentSessionId).set({lecturer:auth.currentUser.email,dept:dept.value,module:module.value,year:year.value,group:group.value,createdAt:new Date().toISOString()});qrSection.classList.remove('hidden');qrLink.innerText=link;qrcode.innerHTML='';new QRCode(qrcode,{text:link,width:220,height:220});db.ref('sessions/'+currentSessionId+'/attendees').on('value',snap=>{const data=snap.val()||{};const arr=Object.values(data);count.innerText=arr.length;list.innerHTML='';arr.sort((a,b)=>new Date(a.time)-new Date(b.time)).forEach((a,i)=>{list.innerHTML+=`<div class=attendee><span>${i+1}. ${a.name} (${a.id})</span><span>${new Date(a.time).toLocaleTimeString()}</span></div>`})})}
function copyLink(){navigator.clipboard.writeText(qrLink.innerText);alert('Copied!')}
function exportCSV(){db.ref('sessions/'+currentSessionId+'/attendees').once('value',s=>{let csv='No,Name,ID,Time\n';Object.values(s.val()||{}).forEach((a,i)=>csv+=`${i+1},${a.name},${a.id},${a.time}\n`);const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=currentSessionId+'.csv';a.click()})}
</script></body></html>
