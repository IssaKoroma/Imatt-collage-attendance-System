<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMATT Lecturer</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:Arial;background:#f5f7fb;padding:15px}.card{background:#fff;padding:20px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,.1)}input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}button{background:#1a73e8;color:#fff;font-weight:bold;border:none;cursor:pointer}.hidden{display:none}#qrcode{display:flex;justify-content:center;margin:15px 0}.attendee{padding:8px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:14px}.linkBtn{background:#0e9f6e;margin-top:10px}</style>
</head><body>
<div class="card" id="loginCard">
<h2>IMATT Lecturer Login</h2>
<input type="email" id="email" placeholder="Lecturer Email e.g lecturer@imatt.edu.sl">
<input type="password" id="password" placeholder="Password (min 6 characters)">
<button onclick="login()">Login</button>
<button class="linkBtn" onclick="signup()">Create Account (New Lecturer)</button>
<p id="loginMsg" style="color:red;font-size:14px"></p>
<p style="font-size:12px;color:#666;text-align:center">New lecturer? Type email + password and click Create Account.<br>Then Login. Any lecturer can use same link on his own phone!</p>
</div>

<div class="card hidden" id="mainCard">
<h3>Welcome <span id="userEmail"></span> <button onclick="logout()" style="width:auto;background:#e53935;padding:6px 12px;float:right">Logout</button></h3>
<select id="dept"><option>Computer Science</option><option>Business Admin</option><option>Engineering</option><option>Applied Sciences</option></select>
<input id="module" placeholder="Module e.g. Operating System">
<select id="year"><option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option></select>
<input id="group" placeholder="Group e.g. Group A">
<button onclick="generateQR()">GENERATE QR CODE</button>
<div id="qrSection" class="hidden"><div id="qrcode"></div><p id="qrLink" style="word-break:break-all;font-size:12px;background:#f1f3f4;padding:8px;border-radius:5px"></p><button onclick="copyLink()" style="background:#34a853">Copy Link</button></div>
<hr><h3>Attendance - <span id="count">0</span></h3><div id="list"></div><button onclick="exportCSV()" style="background:#444">Export CSV</button>
</div>

<script>
// THIS IS YOUR CORRECT CONFIG - FROM YOUR MESSAGE!
const firebaseConfig={apiKey:"AIzaSyBbfZkPmrPyEAkpaaAG5DPb4tk7k30ILPU",authDomain:"imatt---attendance.firebaseapp.com",databaseURL:"https://imatt---attendance-default-rtdb.firebaseio.com",projectId:"imatt---attendance",storageBucket:"imatt---attendance.firebasestorage.app",messagingSenderId:"774914670268",appId:"1:774914670268:web:c0890f062e849f883e5ab9"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
let currentSessionId=null;

auth.onAuthStateChanged(u=>{
 if(u){loginCard.classList.add('hidden');mainCard.classList.remove('hidden');userEmail.innerText=u.email}
 else{loginCard.classList.remove('hidden');mainCard.classList.add('hidden')}
});

function login(){
 const e=email.value.trim(); const p=password.value;
 if(!e||!p){loginMsg.innerText="Enter email and password";return}
 loginMsg.style.color="blue";loginMsg.innerText="Logging in...";
 auth.signInWithEmailAndPassword(e,p).catch(err=>{loginMsg.style.color="red";loginMsg.innerText=err.message})
}

function signup(){
 const e=email.value.trim(); const p=password.value;
 if(!e||!p){loginMsg.innerText="Enter email and password";return}
 if(p.length<6){loginMsg.innerText="Password must be at least 6 characters!";return}
 loginMsg.style.color="blue";loginMsg.innerText="Creating account...";
 auth.createUserWithEmailAndPassword(e,p).then(()=>{
   loginMsg.style.color="green";loginMsg.innerText="✅ Account created for "+e+"! Now click Login."
 }).catch(err=>{loginMsg.style.color="red";loginMsg.innerText=err.message})
}

function logout(){auth.signOut()}
function generateQR(){
 if(!module.value){alert('Enter module');return}
 currentSessionId=dept.value.substring(0,4)+'-'+Date.now();
 const base=location.href.replace('lecturer.html','').replace(/\/$/,'');
 const link=base+'/student.html?session='+currentSessionId;
 db.ref('sessions/'+currentSessionId).set({lecturer:auth.currentUser.email,dept:dept.value,module:module.value,year:year.value,group:group.value,createdAt:new Date().toISOString()});
 qrSection.classList.remove('hidden');qrLink.innerText=link;qrcode.innerHTML='';new QRCode(qrcode,{text:link,width:240,height:240});
 db.ref('sessions/'+currentSessionId+'/attendees').on('value',snap=>{
   const data=snap.val()||{};const arr=Object.values(data);
   count.innerText=arr.length;list.innerHTML='';
   arr.sort((a,b)=>new Date(a.time)-new Date(b.time)).forEach((a,i)=>{
     list.innerHTML+=`<div class=attendee><span>${i+1}. ${a.name} (${a.id})</span><span>${new Date(a.time).toLocaleTimeString()}</span></div>`
   })
 })
}
function copyLink(){navigator.clipboard.writeText(qrLink.innerText);alert('Link Copied!')}
function exportCSV(){
 db.ref('sessions/'+currentSessionId+'/attendees').once('value',s=>{
   let csv='No,Name,ID,Time\n';Object.values(s.val()||{}).forEach((a,i)=>csv+=`${i+1},${a.name},${a.id},${a.time}\n`);
   const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=currentSessionId+'.csv';a.click()
 })
}
</script></body></html>
